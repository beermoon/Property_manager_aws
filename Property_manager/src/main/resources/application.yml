spring:
  # 활성 profile이 명시적으로 지정되지 않았을 때 사용할 기본값.
  # 환경변수 SPRING_PROFILES_ACTIVE 또는 --spring.profiles.active 인자가
  # 들어오면 그 값이 우선합니다.
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

app:
  upload-dir: ./data/uploads
  security:
    # 단일 사용자 — 환경변수가 없으면 부팅 실패하도록 기본값을 두지 않는다.
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}

server:
  tomcat:
    max-part-count: 200
