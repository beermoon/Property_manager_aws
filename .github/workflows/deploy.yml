name: Spring Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Property_manager  # ← 이거 추가!

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 프로젝트 빌드
        run: ./gradlew build -x test

      - name: jar 파일 확인
        run: find . -name "*.jar" -type f

      - name: EC2에 jar 업로드
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Property_manager/build/libs/Property_manager-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app"
          strip_components: 3

      - name: 서버 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 앱 종료
            pkill -f '.jar' || true
            sleep 3

            # 새 jar 실행
            nohup java -jar /home/ubuntu/app/Property_manager-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              --DB_USERNAME=${{ secrets.DB_USERNAME }} \
              --DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              --NAVER_MAPS_JS_KEY_ID=${{ secrets.NAVER_MAPS_JS_KEY_ID }} \
              --NAVER_GEOCODING_KEY_ID=${{ secrets.NAVER_GEOCODING_KEY_ID }} \
              --NAVER_GEOCODING_KEY=${{ secrets.NAVER_GEOCODING_KEY }} \
              > /home/ubuntu/app.log 2>&1 &

            echo "배포 완료!"