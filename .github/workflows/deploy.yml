name: Spring Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Property_manager  # ← 이거 추가!

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 프로젝트 빌드
        run: ./gradlew build -x test

      - name: EC2에 jar 업로드
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: 서버 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pkill -f '.jar' || true
            export SPRING_PROFILES_ACTIVE=prod
            export DB_USERNAME='${{ secrets.DB_USERNAME }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export NAVER_MAPS_JS_KEY_ID='${{ secrets.NAVER_MAPS_JS_KEY_ID }}'
            export NAVER_GEOCODING_KEY_ID='${{ secrets.NAVER_GEOCODING_KEY_ID }}'
            export NAVER_GEOCODING_KEY='${{ secrets.NAVER_GEOCODING_KEY }}'
            nohup java -jar /home/ubuntu/app/build/libs/*.jar > app.log 2>&1 &