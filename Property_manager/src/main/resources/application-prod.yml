spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/propertydb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:property_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

naver:
  maps:
    js-key-id: ${NAVER_MAPS_JS_KEY_ID}
  geocoding:
    key-id: ${NAVER_GEOCODING_KEY_ID}
    key: ${NAVER_GEOCODING_KEY}

app:
  upload-dir: ./data/uploads

logging:
  file:
    name: ./data/logs/app.log