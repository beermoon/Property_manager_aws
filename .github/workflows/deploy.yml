name: Spring Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Property_manager  # ← 이거 추가!

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 프로젝트 빌드
        run: ./gradlew build -x test

      - name: jar 파일 확인
        run: find . -name "*.jar" -type f

      - name: EC2에 jar 업로드
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Property_manager/build/libs/Property_manager-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/app"
          strip_components: 3

      - name: 서버 재시작
        uses: appleboy/ssh-action@v1.0.3  # master → v1.0.3 으로 변경
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            PID=$(pgrep -f 'Property_manager-0.0.1-SNAPSHOT.jar') || true
            if [ -n "$PID" ]; then
              kill -15 $PID
              sleep 3
            fi

            nohup java \
              -jar /home/ubuntu/app/Property_manager-0.0.1-SNAPSHOT.jar \
              --spring.profiles.active=prod \
              > /home/ubuntu/app.log 2>&1 &

            disown $!
            echo "배포 완료!"